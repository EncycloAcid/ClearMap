name: Android APK

on:
  push:
    paths: ["index.html", "src/**", "airports/**", "tools/**", "android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["index.html", "src/**", "airports/**", "tools/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Check index.html is built from src/ and airports/
        working-directory: .
        run: python3 tools/build.py && git diff --exit-code index.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clearway-apk
          path: android/app/build/outputs/apk/release/app-release.apk
